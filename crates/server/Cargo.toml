[package]
name = "grow-server"
description = "GROW local orchestration daemon: repository loading, WASM execution, localhost serving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
grow-core.workspace = true
grow-git.workspace = true
grow-runtime.workspace = true
axum.workspace = true
tokio.workspace = true
mime_guess.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile.workspace = true
wat.workspace = true
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "grow-server"
path = "src/main.rs"
