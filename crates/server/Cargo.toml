[package]
name = "grow-server"
description = "GROW local orchestration daemon: repository loading, WASM execution, localhost serving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["wasm"]
wasm = ["dep:grow-runtime"]

[dependencies]
grow-core.workspace = true
grow-git.workspace = true
grow-runtime = { workspace = true, optional = true }
axum.workspace = true
tokio.workspace = true
mime_guess.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile.workspace = true
wat.workspace = true
tower = { version = "0.5", features = ["util"] }

# The e2e suite drives a real WASM module through the runtime; it only
# exists in the default (wasm) build.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["wasm"]

[[bin]]
name = "grow-server"
path = "src/main.rs"
