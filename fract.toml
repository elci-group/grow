project_root = "/home/sal/grow"
mode = "passive"
entropy_threshold = 0.82
confidence_threshold = 0.9
quiet_period_secs = 120
watch_patterns = [
    "src/**/*.rs",
    "crates/**/*.rs",
    "examples/**/*.rs",
    "**/*.py",
    "**/*.ts",
    "**/*.js",
]
ignore_patterns = [
    "target/**",
    ".git/**",
    "node_modules/**",
    ".venv/**",
    "dist/**",
]
bind = "127.0.0.1:7345"

[llm]
provider = ""
model = ""
max_tokens = 0
