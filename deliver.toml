[[file]]
path = "Cargo.toml"
required = true

[[file]]
path = "README.md"
required = true

[[file]]
path = "docs/roadmap.md"
required = true
require_regex = ["Thirty Domains", "Immediate Execution Backlog", "Current Non-SOTA Gaps"]

[[file]]
path = "docs/mvp.md"
required = true
require_regex = ["MVP Goal", "Capability Contract", "MVP Test Matrix", "Release Gate"]

[[file]]
path = "scripts/check-version.sh"
required = true
require_regex = ["versions aligned", "version mismatch"]

[[file]]
path = "scripts/quality-audit.sh"
required = true

[[command]]
name = "version alignment"
cmd = ["bash", "scripts/check-version.sh"]
expect_exit = 0
timeout_secs = 120
stdout_contains = ["versions aligned"]

[[command]]
name = "workspace format"
cmd = ["cargo", "fmt", "--all", "--", "--check"]
expect_exit = 0
timeout_secs = 120

[[command]]
name = "workspace tests"
cmd = ["cargo", "test", "--workspace"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "workspace clippy"
cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "dependency policy"
cmd = ["cargo", "deny", "check", "--hide-inclusion-graph"]
expect_exit = 0
timeout_secs = 300
